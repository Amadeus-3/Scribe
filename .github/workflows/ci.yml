name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: scribe
          POSTGRES_PASSWORD: scribe
          POSTGRES_DB: scribe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scribe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://scribe:scribe@localhost:5432/scribe?schema=public
      DIRECT_URL: postgresql://scribe:scribe@localhost:5432/scribe?schema=public
      ANTHROPIC_API_KEY: sk-ant-ci-dummy
      AUTH_SECRET: ci-dummy-secret-value-1234567890
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_BASE_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply migrations to a fresh database
        run: pnpm db:deploy
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Test (unit)
        run: pnpm test
      - name: Test (integration, against Postgres service)
        run: pnpm --filter @scribe/core test:integration
      - name: Build
        run: pnpm build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Report-only in Phase 0; flipped to blocking (fail on high/critical) in
      # Phase 7 per Spec §10.7. SHA-pinning of actions is also a Phase 7 item.
      - name: Audit dependencies (report-only)
        run: pnpm audit --audit-level high || true
