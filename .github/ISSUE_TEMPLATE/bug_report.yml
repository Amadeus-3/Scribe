name: Bug report
description: Something in Scribe does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security issues: do NOT file them here. Use private vulnerability reporting (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Settings
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag (`sha-...`) or commit hash, from `docker compose ps` or `git rev-parse HEAD`.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it runs
      options:
        - Docker Compose (production, docker-compose.prod.yml)
        - Docker Compose (local, docker-compose.yml)
        - pnpm dev on the host
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: From `docker compose logs web worker`. Remove any secret before pasting.
      render: shell
