# Host nginx server block for the Scribe dashboard, for a VPS where nginx
# already owns ports 80/443 (the default deployment shape; see docs/deploy.md).
#
#   sed "s/YOUR_DOMAIN/scribe.example.com/" deploy/nginx-scribe.conf \
#     | sudo tee /etc/nginx/sites-available/scribe >/dev/null
#   sudo ln -s /etc/nginx/sites-available/scribe /etc/nginx/sites-enabled/scribe
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR_DOMAIN     # adds the TLS listener
#
# Replace YOUR_DOMAIN with your hostname and, if you changed WEB_BIND_PORT in /opt/scribe/.env,
# the upstream port. certbot rewrites this file to add `listen 443 ssl` and the
# certificate paths; keep the proxy block as-is.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Base64 image uploads from the review UI can be a few MB.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Auth.js builds callback URLs from these; without https here the
        # invite/reset links point at http:// and the sign-in loops.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Server actions that call the LLM run inside the request (~20-60 s).
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }
}
